<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f5f3" />
  <meta name="robots" content="noindex" />
  <title>Paiement refusé · Seddo</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      background: #f6f5f3;
      color: #191613;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 28px 32px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(25, 22, 19, 0.06);
      text-align: center;
      animation: rise 0.4s ease-out both;
    }

    /* Pastille : apparaît en rebondissant, la croix se dessine trait par trait, puis un léger « non » de la tête. */
    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #d93a2b;
      animation:
        pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both,
        shake 0.45s ease-in-out 0.95s;
    }
    .icon line {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw 0.22s ease-out 0.5s forwards;
    }
    .icon line + line { animation-delay: 0.7s; }

    h1, p { animation: rise 0.4s ease-out both; }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
      animation-delay: 0.45s;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #6b645d;
      animation-delay: 0.55s;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.3); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(2px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .icon line { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <main class="card" role="alert">
    <div class="icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="7" y1="7" x2="17" y2="17" pathLength="100"/><line x1="17" y1="7" x2="7" y2="17" pathLength="100"/></svg>
    </div>
    <h1>Paiement refusé</h1>
    <p>Votre paiement n’a pas abouti et votre course n’a pas été lancée. Revenez dans l’application Seddo pour réessayer ou choisir un autre moyen de paiement.</p>
  </main>
</body>
</html>
