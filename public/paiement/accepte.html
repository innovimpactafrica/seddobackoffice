<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f5f3" />
  <meta name="robots" content="noindex" />
  <title>Paiement effectué · Seddo</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      background: #f6f5f3;
      color: #191613;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 28px 32px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(25, 22, 19, 0.06);
      text-align: center;
      animation: rise 0.4s ease-out both;
    }

    /* Pastille : apparaît en rebondissant, une onde s'en échappe, puis la coche se dessine. */
    .icon {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #1f9d5b;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
    }
    .icon::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid #1f9d5b;
      opacity: 0;
      animation: ripple 0.9s ease-out 0.55s;
    }
    .icon polyline {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw 0.4s ease-out 0.5s forwards;
    }

    h1, p { animation: rise 0.4s ease-out both; }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
      animation-delay: 0.45s;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #6b645d;
      animation-delay: 0.55s;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.3); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes ripple {
      from { opacity: 0.55; transform: scale(1); }
      to { opacity: 0; transform: scale(1.9); }
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; }
      .icon polyline { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <main class="card" role="status">
    <div class="icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17.5 19 7" pathLength="100"/></svg>
    </div>
    <h1>Paiement effectué</h1>
    <p>Revenez dans l’application Seddo : la recherche de votre chauffeur démarre dès la confirmation.</p>
  </main>
</body>
</html>
