server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location ~* /(\.env|\.git|\.vscode|\.DS_Store|config\.json|config\.js|wp-json|actuator|telescope|graphql|console/|server-status) {
        return 404;
    }

    location / {
        # $uri/ est volontairement exclu : le build Angular produit des dossiers
        # pré-rendus (login/, otp/, forgot-password/) qui déclenchent sinon une
        # redirection 301 vers l'hôte sans le port mappé. Le routeur Angular gère
        # toutes les routes côté client à partir du même index.html.
        try_files $uri /index.html;
    }
}
